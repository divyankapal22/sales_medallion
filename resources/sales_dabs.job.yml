resources:
  jobs:
    sales_dabs_job:
      name: "[${bundle.target}] sales_dabs_job"
      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: 00_setup
          max_retries: 0
          notebook_task:
            notebook_path: ../src/00_setup.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: 01_bronze_ingest
          depends_on:
            - task_key: 00_setup
          max_retries: 0
          notebook_task:
            notebook_path: ../src/01_bronze_ingest.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: 02_silver_clean
          depends_on:
            - task_key: 01_bronze_ingest
          max_retries: 0
          notebook_task:
            notebook_path: ../src/02_silver_clean.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: 03_gold_kpis
          depends_on:
            - task_key: 02_silver_clean
          max_retries: 0
          notebook_task:
            notebook_path: ../src/03_gold_kpis.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"