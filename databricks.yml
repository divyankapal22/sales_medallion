# This is a Declarative Automation Bundle definition for sales_dabs.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sales_dabs
  uuid: 3d8a7632-ef99-411e-aec6-0c350aaed3be

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-14af95b7-ea77.cloud.databricks.com
    variables:
      catalog: dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-14af95b7-ea77.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/divyankapal22@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/divyankapal22@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
      schema: prod
    permissions:
      - user_name: divyankapal22@gmail.com
        level: CAN_MANAGE
