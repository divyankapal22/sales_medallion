bundle:
  name: sales_dabs

include:
  - resources/*.yml

variables:
  catalog:
    description: Target Unity Catalog
    default: dev
  sp_application_id:
    description: Application ID for sales_prod_sp
    default: "81dd2190-eb6d-4ee7-997d-a2e6b1857956"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-14af95b7-ea77.cloud.databricks.com
      profile: Divi
    variables:
      catalog: dev

  uat:
    mode: production
    workspace:
      host: https://dbc-14af95b7-ea77.cloud.databricks.com
      root_path: /Workspace/Users/divyankapal22@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.sp_application_id}
    variables:
      catalog: uat

  prod:
    mode: production
    workspace:
      host: https://dbc-14af95b7-ea77.cloud.databricks.com
      root_path: /Workspace/Users/divyankapal22@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.sp_application_id}
    variables:
      catalog: prod
      